<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#261D16"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7F1E"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Centered Illuminated Diamond Emblem -->
  <g transform="translate(256, 200)">
    <!-- Outer Diamond Shadow / Glow -->
    <rect x="-64" y="-64" width="128" height="128" rx="16" transform="rotate(45)" fill="url(#goldGrad)" filter="url(#goldGlow)" opacity="0.4"/>
    <!-- Main Diamond -->
    <rect x="-60" y="-60" width="120" height="120" rx="16" transform="rotate(45)" fill="url(#goldGrad)"/>
    <!-- Inner Core Diamond -->
    <rect x="-40" y="-40" width="80" height="80" rx="10" transform="rotate(45)" fill="#18120D"/>
    <!-- Top-Right Crimson Dot -->
    <circle cx="56" cy="-56" r="14" fill="url(#redGrad)" stroke="#0A0806" stroke-width="3"/>
  </g>

  <!-- MLA Wordmark Typography -->
  <text x="256" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" letter-spacing="4" fill="#FAF6EE" text-anchor="middle">
    MLA
  </text>
  <text x="256" y="425" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#D4AF37" text-anchor="middle" text-transform="uppercase">
    ACADEMY
  </text>
</svg>
